<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - School Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header"><h2>SMS</h2></div>
            <nav class="sidebar-menu" id="sidebarMenu"></nav>
            <button class="logout-btn" id="logoutBtn"><span>🚪</span> Logout</button>
        </aside>
        <main class="main-content">
            <header class="top-header">
                <button class="mobile-menu-toggle" id="mobileMenuToggle">☰</button>
                <div class="header-right">
                    <span class="user-name" id="userName"></span>
                    <span class="user-role" id="userRole"></span>
                </div>
            </header>
            <div class="content-wrapper" id="contentWrapper"></div>
        </main>
    </div>
    <div id="modal-overlay" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle"></h3>
                <button class="modal-close" id="modalClose">×</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>
    <div id="toast-container"></div>
    <div id="loading" class="loading-overlay" style="display: none;"><div class="spinner"></div></div>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/forms.js"></script>
    <script src="js/table.js"></script>
    <script src="js/sections.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
